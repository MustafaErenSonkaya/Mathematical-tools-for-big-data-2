# One command:  docker compose up --build
#   control page  http://localhost:8000
#   Grafana       http://localhost:3000   (anonymous read-only; admin/admin to edit)
#   Prometheus    http://localhost:9090
# Ports busy? e.g.  APP_PORT=8001 GRAFANA_PORT=3001 PROM_PORT=9091 docker compose up --build
services:
  app:
    build: .
    image: cmapss-detect-app:1.0
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]   # localhost only: the control API has no login
    environment:
      GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3000}/d/cmapss-detect/sequential-change-detection
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:${PROM_PORT:-9090}:9090"]
    depends_on: [app]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/detection.json
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
